name: hypjsch_cli

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Linux 64bit AppImage'

env:
  BUILD_TYPE: Release

  # Pin known stable SDL3 releases.
  SDL_VERSION: 3.4.12

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@main
    - name: Install Build Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          build-essential \
          make \
          git \
          ninja-build \
          curl \
          libc6 \
          libc6-dev \
          libfuse2 \
          libc-dev-bin \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libdbus-1-dev \
          libudev-dev \
          libusb-1.0-0-dev \
          libwayland-dev \
          libdecor-0-dev \
          liburing-dev \
          imagemagick

    - name: Configure SDL3 Prefix
      run: |
        echo "SDL3_PREFIX=${{ github.workspace }}/sdl3-prefix" >> "$GITHUB_ENV"
        echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/sdl3-prefix" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=${{ github.workspace }}/sdl3-prefix/lib/pkgconfig:${{ github.workspace }}/sdl3-prefix/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/sdl3-prefix/lib:${{ github.workspace }}/sdl3-prefix/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

    # -------------------------------------------------------------------------
    # SDL3
    # -------------------------------------------------------------------------

    - name: Build SDL3
      run: |
        git clone \
          --depth 1 \
          --branch release-${SDL_VERSION} \
          https://github.com/libsdl-org/SDL.git \
          _deps/SDL

        cmake \
          -S _deps/SDL \
          -B _deps/SDL-build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${SDL3_PREFIX}" \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=OFF \
          -DSDL_TESTS=OFF

        cmake --build _deps/SDL-build --parallel
        cmake --install _deps/SDL-build

    - name: Show SDL3 Version
      run: |
        echo "Installed SDL3 libraries:"
        find "${SDL3_PREFIX}" -type f -o -type l | grep -E 'libSDL3|SDL3.*Config' | sort || true

        echo
        echo "pkg-config:"
        PKG_CONFIG_PATH="${PKG_CONFIG_PATH}" pkg-config --modversion sdl3 || true

    # This SHA is now the actual upstream Hypseus master commit we checked out.
    - name: Create Distribution SHA
      run: |
        ShortSHA=$(git rev-parse --short HEAD)
        echo "COMMIT_SHORT_SHA=$ShortSHA" >> "$GITHUB_ENV"

    - name: Build hypjsch
      run: |
        make

        echo
        echo "Dynamic dependencies before packaging:"
        LD_LIBRARY_PATH="${LD_LIBRARY_PATH}" ldd hypjsch_cli

    - name: Build AppImage
      run: |
        mkdir -p build/AppDir/usr/bin
        mkdir -p build/AppDir/usr/lib

        cp hypjsch_cli build/AppDir/usr/bin/hypjsch_cli
        convert -size 256x256 xc:transparent build/AppDir/hypjsch_cli.png

        find "${SDL3_PREFIX}" -name "libSDL3*.so*" -exec cp -a {} build/AppDir/usr/lib/ \;

        ln -s usr/bin/hypjsch_cli build/AppDir/AppRun

        cat > build/AppDir/hypjsch_cli.desktop <<'EOF'
        [Desktop Entry]
        Version=1.0
        Exec=hypjsch_cli
        Icon=hypjsch_cli
        Terminal=false
        Type=Application
        StartupNotify=true
        Hidden=false
        Categories=Game;Emulator;
        Name=hypjsch_cli
        GenericName=hypjsch_cli
        Keywords=emulator;hypseus;singe;daphne;laserdisc
        EOF

        cd build

        curl -sSL \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
          -o linuxdeploy

        curl -sSL \
          https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
          -o AppImageTool

        chmod +x linuxdeploy AppImageTool

        # Make both our custom SDL prefix and AppDir libraries visible while
        # linuxdeploy resolves the executable's dependency tree.
        export LD_LIBRARY_PATH="${SDL3_PREFIX}/lib:${SDL3_PREFIX}/lib/x86_64-linux-gnu:${PWD}/AppDir/usr/lib:${LD_LIBRARY_PATH}"

        ./linuxdeploy \
          -l /lib/x86_64-linux-gnu/libOpenGL.so.0 \
          -l /lib/x86_64-linux-gnu/libgio-2.0.so.0 \
          --appdir AppDir

        echo
        echo "Bundled SDL libraries:"
        find AppDir -name 'libSDL3*.so*' -print

        ./AppImageTool AppDir

        mkdir hypjsch_cli

        cp  hypjsch_cli-x86_64.AppImage hypjsch_cli/
        ln -s hypjsch_cli-x86_64.AppImage hypjsch_cli/hypjsch_cli

        tar -zcvf \
          ../hypjsch_cli_${{ env.COMMIT_SHORT_SHA }}.tar.gz \
          hypjsch_cli

    - uses: actions/upload-artifact@v6
      with:
        name: hypjsch_cli-AppImage-${{ env.COMMIT_SHORT_SHA }}
        path: hypjsch_cli_${{ env.COMMIT_SHORT_SHA }}.tar.gz
